[tool.poetry]
name = "docuify-backend"
version = "0.1.0"
description = "ChatPDF Backend API"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
structlog = "^24.1.0"
slowapi = "^0.1.9"
python-multipart = "^0.0.6"
httpx = "^0.26.0"
aiofiles = "^23.2.1"
python-magic = "^0.4.27"
redis = {extras = ["hiredis"], version = "^5.0.1"}
aiosqlite = "^0.20.0"
pypdf = "^4.2.0"
numpy = "^1.26.0"
fastembed = {version = "^0.3.4", optional = true}

[tool.poetry.extras]
embeddings = ["fastembed"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-asyncio = ">=0.23"
pytest-cov = "^4.1.0"
httpx = "^0.26.0"
ruff = ">=0.6"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
types-aiofiles = "^23.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by the formatter)
    "B008",   # function calls in argument defaults (FastAPI Depends)
    "UP042",  # the (str, Enum) pattern is kept: values are stored and serialised as strings
    "SIM102", # nested ifs are sometimes clearer
    "SIM117", # nested with statements are sometimes clearer
    "SIM905", # the stopword list is easier to read as one wrapped string
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG", "S101"]
"app/core/logging.py" = ["ARG001"]  # structlog processor signature
"app/main.py" = ["ARG001"]          # FastAPI lifespan signature

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "python_magic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
