<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chat with your PDFs. Answers come with page citations and run without an API key." />
    <meta name="theme-color" content="#f1ece0" />
    <title>Folio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23b9472b'/><path d='M9.5 6.5h9l4.5 4.5v14.5h-13.5z' fill='%23fffaf3'/><path d='M12.5 15.5h7M12.5 18.5h7M12.5 21.5h4' stroke='%23b9472b' stroke-width='1.4' stroke-linecap='round'/></svg>" />
    <script>
      /* Apply the saved theme before first paint to avoid a light flash. */
      try {
        var t = localStorage.getItem("folio.theme");
        if (!t && matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
